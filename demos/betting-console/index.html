<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betting operations console — interactive demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   BET Operations Console — shared design system
   One vocabulary for status, filters, selection, actions and price edits.
   ========================================================================== */

:root {
  /* Brand + neutrals */
  --ink: #0d1b2a;
  --ink-2: #33475b;
  --muted: #64748b;
  --faint: #94a3b8;
  --line: #e2e8f0;
  --line-2: #eef2f6;
  --bg: #f3f5f8;
  --card: #ffffff;
  --brand: #0f3d63;
  --brand-600: #155a8a;
  --brand-50: #e8f1f8;
  --rail: #0b2239;
  --rail-2: #12304d;
  --focus: #2f7fd1;

  /* Status system — the same five colours everywhere */
  --pre: #1d5fd1;      --pre-bg: #e9f0fd;      /* Pre-match / Open  — accepting bets */
  --live: #0f8a4a;     --live-bg: #e3f5eb;     /* In-play           — live */
  --susp: #b45309;     --susp-bg: #fdf1e2;     /* Suspended         — bets paused */
  --closed: #516174;   --closed-bg: #edf1f5;   /* Closed            — no new bets, awaiting result */
  --res: #6b3fd4;      --res-bg: #f0ebfd;      /* Resulted          — settled */

  /* Risk + price movement */
  --risk: #c2261f;     --risk-bg: #fdecea;
  --warn: #b7791f;     --warn-bg: #fdf6e3;
  --up: #0f8a4a;       /* price lengthened (drift) */
  --down: #c2261f;     /* price shortened (firm) */
  --edit: #f4b400;     --edit-bg: #fff8e1;     /* unsaved change */

  --r-sm: 6px;
  --r: 8px;
  --r-lg: 12px;
  --shadow: 0 1px 2px rgba(13, 27, 42, .06), 0 1px 3px rgba(13, 27, 42, .04);
  --shadow-lg: 0 12px 32px rgba(13, 27, 42, .16), 0 2px 6px rgba(13, 27, 42, .08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); }
body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1.4;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
}
.num, .price, td.n, .kpi b { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.i { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle; }
.i-sm { width: 14px; height: 14px; }
.i-xs { width: 12px; height: 12px; }
.i-lg { width: 20px; height: 20px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }

/* --------------------------------------------------------------------------
   Desktop shell
   -------------------------------------------------------------------------- */
.desk { width: 1366px; height: 1024px; overflow: hidden; display: grid; grid-template-rows: 56px 1fr; }
.topbar {
  display: flex; align-items: center; gap: 16px;
  background: var(--card); border-bottom: 1px solid var(--line); padding: 0 20px 0 0;
}
.brandmark { width: 76px; height: 56px; display: grid; place-items: center; background: var(--rail); }
.logo {
  font-weight: 800; font-size: 15px; letter-spacing: .5px; color: #fff;
  background: var(--brand-600); border-radius: 6px; padding: 5px 7px 4px; line-height: 1;
}
.logo em { font-style: normal; color: #7cc4ff; }
.product { font-weight: 600; font-size: 14px; color: var(--ink); padding-left: 4px; width: 180px; white-space: nowrap; }
.product small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
.search {
  display: flex; align-items: center; gap: 8px; width: 420px; height: 36px; padding: 0 10px 0 12px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); color: var(--muted);
}
.search span:first-of-type { flex: 1; white-space: nowrap; overflow: hidden; }
.kbd { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 1px 5px; }
.feedstate { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.iconbtn {
  position: relative; width: 36px; height: 36px; border-radius: var(--r); display: grid; place-items: center; color: var(--ink-2);
}
.iconbtn:hover { background: var(--bg); }
.iconbtn .badge { position: absolute; top: 3px; right: 2px; }
.badge {
  min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--risk); color: #fff;
  font-size: 10px; font-weight: 700; display: inline-grid; place-items: center; border: 2px solid #fff; line-height: 1;
}
.me { display: flex; align-items: center; gap: 10px; padding-left: 12px; border-left: 1px solid var(--line); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #1f6fb2, #0f3d63);
  color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none;
}
.me b { display: block; font-size: 13px; font-weight: 600; }
.me span { font-size: 11px; color: var(--muted); }

.body { display: grid; grid-template-columns: 76px 196px 1fr; min-height: 0; }
.rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 2px; }
.rail a {
  width: 64px; padding: 9px 0 7px; border-radius: var(--r); display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: #9fb3c8; text-decoration: none; font-size: 10.5px; font-weight: 500;
}
.rail a.on { background: var(--rail-2); color: #fff; box-shadow: inset 3px 0 0 #7cc4ff; }
.rail .i { width: 20px; height: 20px; }
.rail .spacer { flex: 1; }

.subnav { background: var(--card); border-right: 1px solid var(--line); padding: 16px 12px; overflow: hidden; }
.subnav h6 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 0 8px 8px; }
.seg-mini { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: var(--r); padding: 3px; margin-bottom: 16px; }
.seg-mini button { height: 28px; border-radius: 6px; font-weight: 600; font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg-mini button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.navlist a {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: var(--r-sm);
  color: var(--ink-2); text-decoration: none; font-weight: 500;
}
.navlist a .c { margin-left: auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.navlist a.on { background: var(--brand-50); color: var(--brand); font-weight: 600; }
.navlist a.on .c { color: var(--brand-600); }
.livecount { display: inline-flex; align-items: center; gap: 4px; color: var(--live) !important; font-weight: 600; }
.livecount::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }

.main { min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
.content { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 0; flex: 1; }

/* Page heading */
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.crumbs b { color: var(--ink-2); font-weight: 500; }
.crumbs .i { width: 12px; height: 12px; color: var(--faint); }
.pagehead { display: flex; align-items: flex-end; gap: 16px; }
.pagehead h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.pagehead p { color: var(--muted); margin-top: 3px; }
.pagehead .actions { margin-left: auto; display: flex; gap: 8px; }
.updated { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

/* --------------------------------------------------------------------------
   Buttons — always a label; icon-only buttons are reserved for overflow (⋯)
   Primary = commit, Secondary = neutral, Warn = suspend, Danger = destructive
   -------------------------------------------------------------------------- */
.btn {
  height: 34px; padding: 0 12px; border-radius: var(--r); display: inline-flex; align-items: center; gap: 6px;
  font-weight: 600; font-size: 13px; white-space: nowrap; border: 1px solid transparent;
}
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; gap: 5px; border-radius: 6px; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-secondary { background: #fff; border-color: #cfd8e3; color: var(--ink); }
.btn-ghost { color: var(--ink-2); }
.btn-warn { background: #fff; border-color: #f0c98f; color: var(--susp); }
.btn-danger { background: #fff; border-color: #f2b8b4; color: var(--risk); }
.btn-live { background: #fff; border-color: #a7dcbf; color: var(--live); }
.btn .count { background: rgba(255,255,255,.2); border-radius: 10px; padding: 1px 7px; font-size: 11px; }
.btn-secondary .count { background: var(--bg); }
.btn-icon { width: 34px; padding: 0; justify-content: center; }
.btn-sm.btn-icon { width: 28px; }

/* --------------------------------------------------------------------------
   Status pill — dot + label, identical on events, markets and selections
   -------------------------------------------------------------------------- */
.st {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 7px; border-radius: 11px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap; line-height: 1;
}
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.st.pre { color: var(--pre); background: var(--pre-bg); }
.st.live { color: var(--live); background: var(--live-bg); }
.st.live::before { box-shadow: 0 0 0 3px rgba(15, 138, 74, .22); }
.st.susp { color: var(--susp); background: var(--susp-bg); }
.st.susp::before { border-radius: 1px; width: 6px; height: 6px; }
.st.closed { color: var(--closed); background: var(--closed-bg); }
.st.res { color: var(--res); background: var(--res-bg); }
.st.won { color: var(--live); background: var(--live-bg); }
.st.lost { color: var(--closed); background: var(--closed-bg); }
.st.pend { color: var(--pre); background: var(--pre-bg); }
.st.void { color: var(--res); background: var(--res-bg); }
.st.lg { height: 26px; font-size: 12.5px; padding: 0 10px 0 9px; border-radius: 13px; }

/* Neutral descriptor tag — types, tags, promos. Never coloured, so it can't be mistaken for status */
.tag {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 5px;
  border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-size: 11.5px; font-weight: 500; white-space: nowrap;
}
.tag .i { width: 12px; height: 12px; color: var(--faint); }
.tag.solid { background: var(--bg); border-color: transparent; }

/* Risk flag */
.flag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--risk); }
.flag.warn { color: var(--warn); }
.flag .i { width: 13px; height: 13px; }

/* --------------------------------------------------------------------------
   Filters — segmented status tabs with counts, field controls, removable chips
   -------------------------------------------------------------------------- */
.filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.segtabs { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 3px; gap: 2px; }
.segtabs button {
  height: 28px; padding: 0 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 7px;
  font-weight: 600; font-size: 12.5px; color: var(--muted); white-space: nowrap;
}
.segtabs button .dot { width: 7px; height: 7px; border-radius: 50%; }
.segtabs button .c { font-size: 11px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
.segtabs button.on { background: var(--brand); color: #fff; }
.segtabs button.on .c { color: rgba(255,255,255,.75); }
.field {
  height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; background: #fff;
  border: 1px solid #cfd8e3; border-radius: var(--r); color: var(--ink); font-weight: 500; white-space: nowrap;
}
.field small { color: var(--muted); font-weight: 500; font-size: 12px; }
.field .i-down { color: var(--muted); width: 14px; height: 14px; }
.field.set { border-color: var(--brand-600); background: var(--brand-50); }
.field.input { color: var(--faint); font-weight: 400; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.sw { width: 30px; height: 18px; border-radius: 9px; background: #cbd5e1; position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.sw.on { background: var(--brand-600); }
.sw.on::after { left: 14px; }
.sw.live.on { background: var(--live); }
.chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chips .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 13px;
  background: var(--brand-50); color: var(--brand); font-weight: 600; font-size: 12px; white-space: nowrap;
}
.chip span { font-weight: 500; color: var(--brand-600); }
.chip .x { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: rgba(15,61,99,.1); }
.chip .x .i { width: 11px; height: 11px; }
.clearall { font-size: 12px; font-weight: 600; color: var(--brand-600); margin-left: 4px; }

/* --------------------------------------------------------------------------
   Selection — checkbox, selected rows, bulk action bar
   -------------------------------------------------------------------------- */
.cb {
  width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid #b6c2d1; background: #fff; flex: none;
  display: inline-grid; place-items: center;
}
.cb.on { background: var(--brand); border-color: var(--brand); }
.cb.on::after { content: ""; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.cb.mixed { background: var(--brand); border-color: var(--brand); }
.cb.mixed::after { content: ""; width: 8px; height: 2px; background: #fff; border-radius: 1px; }
.bulkbar {
  display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 10px 0 14px; border-radius: var(--r);
  background: var(--ink); color: #fff;
}
.bulkbar b { font-weight: 600; }
.bulkbar .btn { height: 30px; font-size: 12.5px; }
.bulkbar .btn-dk { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.14); }
.bulkbar .btn-dk.warn { color: #ffcf8a; }
.bulkbar .btn-dk.danger { color: #ffb3ad; }
.bulkbar .lnk { color: #9fc6ec; font-weight: 600; font-size: 12.5px; }

/* --------------------------------------------------------------------------
   Cards + tables
   -------------------------------------------------------------------------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.tbl th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  padding: 0 10px; height: 36px; background: #f8fafc; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.tbl th.n, .tbl td.n { text-align: right; }
.tbl td { overflow: hidden; text-overflow: ellipsis; padding: 0 10px; height: 52px; border-bottom: 1px solid var(--line-2); vertical-align: middle; white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.sel td { background: #f2f7fc; }
.tbl tr.attn td:first-child { box-shadow: inset 3px 0 0 var(--risk); }
.tbl tr.susp td { background: #fffbf5; }
.tbl tr.dim td { color: var(--muted); }
.tbl .sort { display: inline-flex; align-items: center; gap: 3px; color: var(--ink-2); }
.teams b { display: block; font-weight: 600; font-size: 13px; }
.teams span { color: var(--muted); font-size: 12px; }
.time b { display: block; font-weight: 600; font-variant-numeric: tabular-nums; }
.time span { font-size: 11.5px; color: var(--muted); }
.time .soon { color: var(--susp); font-weight: 600; }
.bar { width: 64px; height: 5px; border-radius: 3px; background: var(--line-2); overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--brand-600); border-radius: 3px; }
.bar.hot i { background: var(--risk); }
.bar.mid i { background: var(--warn); }

/* KPI strip */
.kpis { display: grid; gap: 12px; }
.kpi { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.kpi .t { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi b { font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
.kpi .s { font-size: 11.5px; color: var(--muted); }
.kpi.alert { border-color: #f4c3bf; background: linear-gradient(0deg, #fff, #fff7f6); }
.kpi.alert b { color: var(--risk); }

/* --------------------------------------------------------------------------
   Price stepper — explicit − / + with the step size, delta vs. published price
   -------------------------------------------------------------------------- */
.stepper {
  display: inline-flex; align-items: stretch; height: 32px; border: 1px solid #cfd8e3; border-radius: var(--r); background: #fff; overflow: hidden;
}
.stepper button { width: 30px; display: grid; place-items: center; color: var(--ink-2); background: #f8fafc; }
.stepper button:first-child { border-right: 1px solid var(--line); }
.stepper button:last-child { border-left: 1px solid var(--line); }
.stepper .v { width: 54px; display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.stepper.dirty { border-color: var(--edit); box-shadow: 0 0 0 3px rgba(244, 180, 0, .18); }
.stepper.dirty .v { background: var(--edit-bg); }
.stepper.locked { background: #f8fafc; }
.stepper.locked .v { color: var(--muted); }
.stepper.locked button { color: #c4cedb; }
.stepper.sm { height: 28px; }
.stepper.sm button { width: 26px; }
.stepper.sm .v { width: 46px; font-size: 13px; }
.delta { display: inline-flex; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta .was { color: var(--muted); font-weight: 500; margin-left: 3px; }
.delta .i { width: 11px; height: 11px; stroke-width: 2.6; }
.stepnote { font-size: 11px; color: var(--muted); }

/* Price cell (read state) */
.px {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 44px; border-radius: var(--r);
  border: 1px solid var(--line); background: #fff; min-width: 70px;
}
.px small { font-size: 10.5px; color: var(--muted); font-weight: 500; }
.px b { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 3px; }
.px b .i { width: 11px; height: 11px; stroke-width: 2.8; }
.px.up b .i { color: var(--up); }
.px.down b .i { color: var(--down); }
.px.dirty { border-color: var(--edit); background: var(--edit-bg); box-shadow: 0 0 0 3px rgba(244, 180, 0, .18); }
.px.locked { background: #f8fafc; }
.px.locked b { color: var(--faint); }

/* Unsaved-changes bar */
.savebar {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: var(--r-lg);
  background: var(--ink); color: #fff; box-shadow: var(--shadow-lg);
}
.savebar .dotedit { width: 8px; height: 8px; border-radius: 50%; background: var(--edit); box-shadow: 0 0 0 4px rgba(244,180,0,.25); }
.savebar .btn-dk { background: transparent; color: #cfe0f1; border-color: rgba(255,255,255,.2); }
.savebar .btn-go { background: #fff; color: var(--ink); }
.savebar small { color: #9fb3c8; font-size: 12px; }

/* Tabs */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); }
.tabs a { height: 38px; display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a.on { color: var(--brand); border-color: var(--brand); }
.tabs a .c { font-size: 11px; background: var(--bg); color: var(--muted); border-radius: 9px; padding: 1px 7px; font-weight: 600; }
.tabs a.on .c { background: var(--brand-50); color: var(--brand); }

/* Team crest placeholder */
.crest { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9px; font-weight: 800; color: #fff; flex: none; letter-spacing: -.02em; }

/* --------------------------------------------------------------------------
   Mobile shell (375 × 812)
   -------------------------------------------------------------------------- */
.phone { width: 375px; height: 812px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; position: relative; }
.statusbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 28px; font-weight: 600; font-size: 14px; background: #fff; }
.statusbar .sys { display: flex; gap: 5px; align-items: center; }
.statusbar .sys i { display: block; background: var(--ink); border-radius: 1px; }
.appbar { flex: none; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 12px; background: #fff; border-bottom: 1px solid var(--line); }
.appbar h2 { font-size: 16px; font-weight: 700; flex: 1; }
.appbar h2 small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.mscroll { flex: 1; overflow: hidden; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }

          <div><h1>Jordan Nguyen ${pill('live', 'Active')}<span class="tag">${ic('check')}ID verified</span><span class="tag">${ic('tag')}VIP Silver</span></h1>
          <p>Customer C-204815 · Member since Mar 2021 · Melbourne VIC · Last active 4 min ago on iOS app</p></div>
          <div class="grow"></div>
          <button class="btn btn-secondary">${ic('note')}Add note</button><button class="btn btn-secondary">${ic('sliders')}Limits</button><button class="btn btn-danger">${ic('ban')}Restrict account</button>
        </div>
        <div class="stats">
          <div><small>Balance</small><b>${D === 'void' ? '$1,440.50' : '$1,240.50'}</b></div><div><small>Withdrawable</small><b>$980.00</b></div>
          <div><small>Open bets</small><b>${D === 'void' ? 2 : 3}</b></div><div><small>Turnover · 90 days</small><b>$18.6k</b></div>
          <div><small>Customer P/L · 90 days</small><b style="color:var(--risk)">−$1,108</b></div><div><small>Deposit limit</small><b>$1,000</b> <span class="muted" style="font-size:12px">/ week</span></div>
        </div>
      </div>
      <div class="case ${D ? 'done' : ''}">
        <span class="ico">${ic(D ? 'result' : 'alert')}</span>
        <div><b>Dispute D-3318</b> ${D ? pill('res', 'Resolved') : pill('susp', 'Open')} <span style="margin-left:6px;color:var(--ink-2)">“I bet Storm −4.5 at 1.90 but my ticket says 1.85.”</span> <span class="muted">· ${D ? outcome : 'opened via live chat 12 min ago · assigned to you'}</span></div>
        <div class="grow"></div>${D ? `<button class="btn btn-sm btn-secondary" data-act="undo">Undo</button>` : `<button class="btn btn-sm btn-secondary">View chat</button>`}
      </div>
      <div class="tabs"><a class="on">Bets <span class="c">186</span></a><a>Payments <span class="c">42</span></a><a>Account activity</a><a>Notes <span class="c">3</span></a></div>
      <div class="split">
        <div class="card" style="overflow:hidden;align-self:start">
          <table class="tbl"><thead><tr><th style="width:96px;padding-left:16px">Placed</th><th>Selection</th><th style="width:80px">Type</th><th class="n" style="width:80px">Stake</th><th class="n" style="width:66px">Price</th><th class="n" style="width:88px">Return</th><th style="width:100px">Status</th></tr></thead>
          <tbody>${bets.map(b => `<tr class="${b[9] ? 'sel' : ''}">
            <td class="time" style="padding-left:16px;${b[9] ? 'box-shadow:inset 3px 0 0 var(--brand)' : ''}"><b>${b[0]}</b><span>${b[1]}</span></td>
            <td class="sel-cell"><b>${b[2]}</b><span>${b[3]}</span></td><td><span class="tag">${b[4]}</span></td>
            <td class="n num">$${b[5].toFixed(2)}</td><td class="n num"><b>${b[9] ? price : b[6]}</b></td>
            <td class="n num" style="${b[8] === 'won' ? 'color:var(--live);font-weight:600' : b[8] === 'lost' ? 'color:var(--faint)' : ''}">${b[9] ? ret : b[7]}</td>
            <td>${pill(b[8], BS[b[8]])}</td></tr>`).join('')}</tbody></table>
        </div>
        <div class="card panel">
          <div class="ph"><h3>Bet PB-4821309 ${pill(D === 'void' ? 'void' : 'pend', D === 'void' ? 'Void' : 'Pending')}</h3><p>Storm −4.5 · Line · NRL Preliminary Final · placed 7:44:10 pm on iOS</p></div>
          <div class="betsum"><div><small>Stake</small><b>$200.00</b></div><div><small>Price</small><b>${price}</b></div><div><small>${D === 'void' ? 'Refunded' : 'Potential return'}</small><b>${ret}</b></div></div>
          <div class="tl"><h4>Timeline · bets, prices &amp; payments</h4>
            <div class="ev pay"><span class="dot">${ic('wallet')}</span><div><b>Deposit $200.00 · PayID</b><span>Cleared instantly</span></div><time>7:39:02</time></div>
            <div class="ev bet"><span class="dot">${ic('eye')}</span><div><b>Viewed Storm −4.5 at 1.90</b><span>Added to bet slip</span></div><time>7:43:52</time></div>
            <div class="ev hl"><span class="dot">${ic('edit')}</span><div><b>Price changed 1.90 → 1.85</b><span>Manual reprice by J. Stamos · sharp money</span></div><time>7:44:06</time></div>
            <div class="ev bet"><span class="dot">${ic('check')}</span><div><b>Customer accepted new price 1.85</b><span>“Odds have changed” prompt shown in app</span></div><time>7:44:10</time></div>
            ${D ? `<div class="ev res"><span class="dot">${ic('result')}</span><div><b>Dispute resolved</b><span>${outcome}</span></div><time>now</time></div>` : `<div class="ev"><span class="dot">${ic('note')}</span><div><b>Dispute D-3318 opened</b><span>Live chat · assigned to you</span></div><time>7:56:31</time></div>`}
          </div>
          <div class="resolve">${D ? `<h4 style="color:var(--res)">Resolved — the full story was on one screen</h4><div class="row"><button class="btn btn-sm btn-secondary" data-act="undo">Undo resolution</button><button class="btn btn-sm btn-primary" data-act="go" data-v="queue">Back to risk queue</button></div>`
            : `<h4>Resolve dispute</h4><div class="row"><button class="btn btn-sm btn-secondary" data-act="resolve" data-v="honour">Honour 1.90</button><button class="btn btn-sm btn-danger" data-act="resolve" data-v="void">Void &amp; refund</button><button class="btn btn-sm btn-primary pulse" data-act="resolve" data-v="keep">${ic('check', 'i-sm')}Keep at 1.85</button></div>`}</div>
        </div>
      </div>`;
  }

  // ---------- render + events ----------
  function render() {
    desk.innerHTML = shell();
    document.getElementById('savehost').innerHTML = S.view === 'event' ? saveBar() : '';
    document.querySelectorAll('.steps button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
    fit();
  }
  let tt;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.querySelector('span').textContent = msg;
    t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400);
  }
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const { act, v, id, k, i } = el.dataset;
    const E = S.events.find(e => e.id === id);
    switch (act) {
      case 'go': S.view = v; window.scrollTo({ top: 0 }); break;
      case 'reset': S = initial(); toast('Demo reset'); break;
      case 'filter': S.filter = v; break;
      case 'sel': S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id); break;
      case 'selall': {
        const rows = S.events.filter(e => S.filter === 'all' || e.st === S.filter);
        const all = rows.every(e => S.selected.has(e.id));
        rows.forEach(e => all ? S.selected.delete(e.id) : S.selected.add(e.id)); break;
      }
      case 'clearsel': S.selected.clear(); break;
      case 'bulk': {
        let n = 0;
        S.events.forEach(e => { if (S.selected.has(e.id) && e.st !== 'closed') { if (v === 'susp' && e.st !== 'susp') e.prev = e.st; e.st = v === 'pre' ? (e.prev || 'pre') : v; if (v !== 'susp') e.note = v === 'closed' ? 'Betting closed' : ''; n++; } });
        S.selected.clear();
        toast(`${n} event${n === 1 ? '' : 's'} ${v === 'susp' ? 'suspended' : v === 'closed' ? 'closed for betting' : 'resumed'}`); break;
      }
      case 'setst': E.st = v; E.note = ''; toast(`${E.name} resumed`); break;
      case 'toast': toast(v); break;
      case 'step': {
        const s = S.mk[k].sels[+i];
        const step = (ev.shiftKey ? 0.05 : 0.01) * +v;
        s.cur = Math.max(1.01, +(s.cur + step).toFixed(2)); break;
      }
      case 'follow': {
        const m = S.mk[k]; m.follow = !m.follow;
        if (m.follow) m.sels.forEach(s => { s.cur = s.pub = s.bg; });
        toast(m.follow ? 'Now following BetGenius · prices locked' : 'Manual pricing on · use − / + to edit'); break;
      }
      case 'mst': S.mk[k].st = v; toast(v === 'susp' ? 'Market suspended · bets paused' : 'Market resumed'); break;
      case 'evsusp': ['line', 'h2h', 'total'].forEach(x => S.mk[x].st = 'susp'); toast('All markets on this event suspended'); break;
      case 'discard': ['line', 'h2h'].forEach(x => S.mk[x].sels.forEach(s => s.cur = s.pub)); toast('Changes discarded'); break;
      case 'publish': {
        const n = dirty().length;
        ['line', 'h2h'].forEach(x => S.mk[x].sels.forEach(s => s.pub = s.cur));
        const st = S.mk.line.sels[0];
        const sto = S.events.find(e => e.id === 'sto');
        if (st.pub < 1.88) { sto.flag = null; sto.pct = 62; sto.liab = +(st.liab * (st.pub - 1) / 0.9).toFixed(1); }
        toast(`${n} price${n === 1 ? '' : 's'} published · live now`); break;
      }
      case 'resolve': S.dispute = v; toast('Dispute resolved · customer notified'); break;
      case 'undo': S.dispute = null; break;
      default: return;
    }
    render();
  });

  // Scale the 1366px-wide console to fit any container (iframe, column, phone)
  const stage = document.getElementById('stage'), vp = document.getElementById('viewport');
  function fit() {
    const s = Math.min(1, document.documentElement.clientWidth / 1366);
    stage.style.transform = `scale(${s})`;
    document.getElementById('savehost').style.setProperty('--s', s);
    vp.style.height = (stage.offsetHeight * s) + 'px';
  }
  window.addEventListener('resize', fit);

  S = initial();
  const start = new URLSearchParams(location.search).get('step');
  if (['queue', 'event', 'customer'].includes(start)) S.view = start;
  render();
})();
</script>
