<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LoanInsights — interactive prototype</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1b2430;
    --muted: #6b7685;
    --brand: #2795ff;
    --bg: #eef1f5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 12px 28px;
    min-height: 100%;
  }
  .stage {
    position: relative;
    width: min(360px, 92vw);
    user-select: none;
  }
  .screen-wrap {
    position: relative;
    width: 100%;
    line-height: 0;
  }
  .screen {
    display: none;
    width: 100%;
    height: auto;
    border-radius: 18px;
  }
  .screen.is-active { display: block; }
  .tap-layer {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 0;
    background: none;
    border: 0;
    cursor: pointer;
    border-radius: 18px;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tap-layer[hidden] { display: none; }
  .hotspot {
    position: absolute;
    background: transparent;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hotspot:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
    border-radius: 999px;
  }

  .hint {
    margin-top: 14px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    min-height: 1.2em;
  }

  .dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 10px;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c7cedb;
    transition: background-color 0.2s ease;
  }
  .dots span.is-active { background: var(--brand); }

  .restart {
    display: none;
    margin: 14px auto 0;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    border: 1px solid #d7dce4;
    background: #fff;
    color: var(--ink);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .restart.is-visible { display: inline-block; }

  /* iOS-style push notification banner */
  .notification {
    position: absolute;
    left: 6%;
    right: 6%;
    top: 4%;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(6px);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    opacity: 0;
    transform: translateY(-140%);
    transition: transform 0.38s cubic-bezier(.2,.8,.3,1.2), opacity 0.25s ease;
    pointer-events: none;
    z-index: 5;
  }
  .notification.is-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    cursor: pointer;
  }
  .notification__icon {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(155deg, var(--brand), #1a63c4);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.01em;
  }
  .notification__body { flex: 1 1 auto; min-width: 0; }
  .notification__top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
  }
  .notification__app {
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--ink);
  }
  .notification__time {
    font-size: 0.72rem;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .notification__msg {
    margin: 2px 0 0;
    font-size: 0.82rem;
    line-height: 1.35;
    color: #333c47;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="screen-wrap" id="screenWrap">
      <img class="screen is-active" data-screen="1" src="screen-1.png" alt="Property search map showing 42 Robert St, Leichhardt" />
      <img class="screen" data-screen="2" src="screen-2.png" alt="Property report for 42 Robert St with a Start loan wizard button" />
      <img class="screen" data-screen="3" src="screen-3.png" alt="Loan wizard borrowing-amount step" />
      <img class="screen" data-screen="4" src="screen-4.png" alt="Estimated loan outcome with Request call and email buttons" />

      <!-- Whole-screen tap layer for steps 1-3 -->
      <button type="button" class="tap-layer" id="tapAdvance" aria-label="Continue"></button>

      <!-- Precise hotspots over the real buttons on screen 4 -->
      <button type="button" class="hotspot" id="hotspotCall" hidden
        style="left:37.35%; top:86.13%; width:18.9%; height:4.94%;"
        aria-label="Request a call"></button>
      <button type="button" class="hotspot" id="hotspotEmail" hidden
        style="left:57.03%; top:86.13%; width:5.25%; height:4.94%;"
        aria-label="Email the report"></button>

      <div class="notification" id="notification" role="status" aria-live="polite">
        <div class="notification__icon">LI</div>
        <div class="notification__body">
          <div class="notification__top">
            <span class="notification__app">LoanInsights</span>
            <span class="notification__time">now</span>
          </div>
          <p class="notification__msg" id="notificationMsg"></p>
        </div>
      </div>
    </div>

    <div class="dots" id="dots">
      <span data-dot="1"></span>
      <span data-dot="2"></span>
      <span data-dot="3"></span>
      <span data-dot="4"></span>
    </div>
    <p class="hint" id="hint">Tap the screen to continue</p>
    <button type="button" class="restart" id="restartBtn">Start over</button>
  </div>

  <script>
    (function () {
      var total = 4;
      var current = 1;
      var screens = Array.prototype.slice.call(document.querySelectorAll(".screen"));
      var dots = Array.prototype.slice.call(document.querySelectorAll("[data-dot]"));
      var tapAdvance = document.getElementById("tapAdvance");
      var hotspotCall = document.getElementById("hotspotCall");
      var hotspotEmail = document.getElementById("hotspotEmail");
      var notification = document.getElementById("notification");
      var notificationMsg = document.getElementById("notificationMsg");
      var hint = document.getElementById("hint");
      var restartBtn = document.getElementById("restartBtn");
      var notifTimer = null;

      var hints = {
        1: "Tap the map to search this address",
        2: "Tap “Start loan wizard” to continue",
        3: "Tap “Next” to see the estimate",
        4: "Tap “Request call” or the email icon"
      };

      function render() {
        screens.forEach(function (el) {
          el.classList.toggle("is-active", Number(el.getAttribute("data-screen")) === current);
        });
        dots.forEach(function (el) {
          el.classList.toggle("is-active", Number(el.getAttribute("data-dot")) === current);
        });
        hint.textContent = hints[current] || "";
        var onLast = current === total;
        tapAdvance.hidden = onLast;
        hotspotCall.hidden = !onLast;
        hotspotEmail.hidden = !onLast;
        restartBtn.classList.toggle("is-visible", onLast);
      }

      function advance() {
        if (current < total) {
          current += 1;
          render();
        }
      }

      function restart() {
        hideNotification();
        current = 1;
        render();
      }

      function showNotification(message) {
        notificationMsg.textContent = message;
        notification.classList.add("is-visible");
        clearTimeout(notifTimer);
        notifTimer = setTimeout(hideNotification, 5200);
      }

      function hideNotification() {
        notification.classList.remove("is-visible");
        clearTimeout(notifTimer);
      }

      tapAdvance.addEventListener("click", advance);
      restartBtn.addEventListener("click", restart);
      notification.addEventListener("click", hideNotification);

      hotspotCall.addEventListener("click", function () {
        showNotification("Thanks for your interest in 42 Robert St, Leichhardt — one of our agents will be in touch with you soon.");
      });

      hotspotEmail.addEventListener("click", function () {
        showNotification("Your property report and your prospective loan for 42 Robert St, Leichhardt have been sent to your inbox.");
      });

      render();
    })();
  </script>
</body>
</html>
